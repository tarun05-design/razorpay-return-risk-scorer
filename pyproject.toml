[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "razorpay-return-risk-scorer"
version = "1.0.0"
description = "Razorpay Return Risk Scorer & Dynamic Magic Checkout Demo"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5"
]

[tool.vercel]
entrypoint = "src.return_risk.api:app"
